[package]
name = "mchose-hub-rust"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/mansur54321/mchose-hub-rust"
description = "Native Linux and Windows controller for MCHOSE Ace 75 8K, A7 V3 Ultra+ and MagDock"

[dependencies]
anyhow = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui-winit = { version = "=0.33.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
base64 = "0.22"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["wayland", "x11"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native"] }
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland"] }
x11rb = { version = "0.13.2", features = ["xkb", "xtest"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
wasapi = "=0.26.0"
windows = { version = "=0.62.2", features = ["Win32_Media_Audio", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
